seed: 42
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports
data:
  # Hugging Face's current namespaced identifier for the legacy `ms_marco` loader.
  dataset_name: microsoft/ms_marco
  dataset_config: v1.1
  train_pairs: 500000
  dev_queries: 2000
  min_passage_tokens: 5
  language: en
  duplicate_jaccard_threshold: 0.92
  max_passages_per_query: 10
bm25:
  k1: 1.5
  b: 0.75
  top_k: 100
dense:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 128
  top_k: 100
  ivf_nlist: 256
  ivf_nprobe: 16
hybrid:
  rrf_k: 60
reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 16
  epochs: 1
  learning_rate: 2.0e-5
  max_length: 256
  hard_negative_count: 4
  rerank_depths: [20, 50, 100]
